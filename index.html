<!doctype html>
<html lang="en" data-brand="teepublic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketplace Prototypes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/teepublic.css">
  <link rel="stylesheet" href="css/redbubble.css">
</head>
<body>
  <header class="panel" aria-label="Prototype controls">
    <span class="panel-label">Control panel</span>
    <div class="switch" role="group" aria-label="Brand">
      <button type="button" data-brand-btn="teepublic" aria-pressed="true">TeePublic</button>
      <button type="button" data-brand-btn="redbubble" aria-pressed="false">Redbubble</button>
    </div>
  </header>

  <main class="stage">
    <section id="grid" class="grid" aria-label="Products"></section>
  </main>

  <script src="js/products.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
